<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>陸上ダービー ベットシステム</title>
  <meta name="description" content="陸上競技のレース結果を予想してポイントを賭けるダービーシステム" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              50:  '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* ===== カスタムアニメーション ===== */
    .fade-in {
      animation: fadeIn 0.35s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .slide-up {
      animation: slideUp 0.3s ease-out forwards;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* グラスモーフィズム */
    .glass {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    /* カスタムスクロールバー非表示 */
    body { -webkit-overflow-scrolling: touch; }
    /* ローディングスピナー */
    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      width: 18px; height: 18px;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="font-sans text-gray-800 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen">

  <!-- ===== ログインモーダル ===== -->
  <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="glass rounded-2xl shadow-2xl p-8 w-[340px] slide-up border border-white/20">
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">🏃‍♂️</div>
        <h1 class="text-2xl font-extrabold text-gray-900">陸上ダービー</h1>
        <p class="text-sm text-gray-500 mt-1">ログインしてベットを始めよう</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1" for="loginId">ユーザーID</label>
          <input type="text" id="loginId" name="loginId"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" placeholder="例: user01" required />
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1" for="loginPin">暗証番号 (4桁)</label>
          <input type="password" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" id="loginPin" name="loginPin"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition tracking-[0.3em]" placeholder="••••" required />
        </div>
        <button type="submit" id="loginBtn"
          class="w-full bg-gradient-to-r from-brand-600 to-brand-500 text-white font-bold rounded-lg py-2.5 hover:from-brand-700 hover:to-brand-600 active:scale-[0.98] transition-all shadow-lg shadow-brand-500/30">
          ログイン
        </button>
      </form>
      <p id="loginError" class="text-red-500 text-xs text-center mt-3 hidden"></p>
    </div>
  </div>

  <!-- ===== メインコンテンツ ===== -->
  <div id="app" class="hidden max-w-md mx-auto pb-8">
    <!-- ヘッダー -->
    <header class="sticky top-0 z-40 glass border-b border-white/10 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🏃‍♂️</span>
        <h1 class="text-lg font-extrabold text-gray-900">陸上ダービー</h1>
      </div>
      <div class="flex items-center gap-2">
        <span id="userPoints" class="text-sm font-bold text-brand-600 bg-brand-50 px-3 py-1 rounded-full">-- pt</span>
        <button id="logoutBtn" class="text-xs text-gray-400 hover:text-red-500 transition" title="ログアウト">🚪</button>
      </div>
    </header>

    <!-- タブ切り替え -->
    <div class="flex mx-4 mt-4 bg-white/10 rounded-xl p-1 gap-1">
      <button id="tabBet" class="flex-1 py-2 text-center rounded-lg text-sm font-bold transition-all bg-white text-brand-700 shadow">🎯 ベット画面</button>
      <button id="tabRanking" class="flex-1 py-2 text-center rounded-lg text-sm font-bold transition-all text-white/60 hover:text-white">🏆 順位表</button>
    </div>

    <!-- ベット画面 -->
    <section id="sectionBet" class="px-4 mt-4 space-y-3">
      <div id="loadingIndicator" class="text-center py-10">
        <div class="spinner border-brand-400 border-t-white mx-auto mb-3" style="width:30px;height:30px;border-width:4px;"></div>
        <p class="text-white/60 text-sm">レース情報を取得中...</p>
      </div>
      <div id="raceList" class="grid grid-cols-1 gap-3">
        <!-- レースカードはJavaScriptで動的に生成 -->
      </div>
    </section>

    <!-- 順位表 -->
    <section id="sectionRanking" class="hidden px-4 mt-4">
      <div class="bg-white/10 backdrop-blur rounded-2xl overflow-hidden border border-white/10">
        <table class="min-w-full">
          <thead>
            <tr class="bg-brand-600/80 text-white text-sm">
              <th class="px-4 py-3 text-left font-semibold">順位</th>
              <th class="px-4 py-3 text-left font-semibold">ユーザー</th>
              <th class="px-4 py-3 text-right font-semibold">所持pt</th>
            </tr>
          </thead>
          <tbody id="rankingBody" class="text-white/80 text-sm">
            <!-- ランキングはJSで描画 -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- ===== ベット確認モーダル ===== -->
  <div id="betModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm hidden">
    <div class="glass rounded-t-2xl sm:rounded-2xl shadow-2xl p-6 w-full max-w-md slide-up border border-white/20">
      <h2 class="text-lg font-bold text-gray-900 mb-1">ベットする</h2>
      <p id="betTargetInfo" class="text-sm text-gray-500 mb-4"></p>
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1" for="betAmount">賭けるポイント</label>
        <input type="number" id="betAmount" min="1" inputmode="numeric"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" placeholder="例: 100" required />
      </div>
      <div class="flex gap-3">
        <button id="betCancel" class="flex-1 py-2.5 rounded-lg border border-gray-300 text-gray-600 font-bold text-sm hover:bg-gray-100 transition">キャンセル</button>
        <button id="betConfirm" class="flex-1 py-2.5 rounded-lg bg-gradient-to-r from-brand-600 to-brand-500 text-white font-bold text-sm hover:from-brand-700 hover:to-brand-600 active:scale-[0.98] transition-all shadow-lg shadow-brand-500/30">
          ベットする
        </button>
      </div>
      <p id="betError" class="text-red-500 text-xs text-center mt-3 hidden"></p>
    </div>
  </div>

  <!-- ===== JavaScript ===== -->
  <script>
    // ========================================
    // 定数: GAS Web App の URL
    // ========================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx5pTAK5Y7M3fO_UVkIgZjO4juTMcyzu5cV-_syQLzP3oN6v_Gb631W-JHaBRgdQ7befQ/exec';

    // ========================================
    // ユーティリティ
    // ========================================
    const $ = id => document.getElementById(id);

    // ========================================
    // ログイン処理
    // ========================================
    $('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const id  = $('loginId').value.trim();
      const pin = $('loginPin').value.trim();
      if (!id || !pin) return;

      localStorage.setItem('userId', id);
      localStorage.setItem('userPin', pin);
      $('loginModal').classList.add('hidden');
      $('app').classList.remove('hidden');
      await initApp();
    });

    // ログアウト
    $('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('userId');
      localStorage.removeItem('userPin');
      location.reload();
    });

    // ========================================
    // タブ切り替え
    // ========================================
    $('tabBet').addEventListener('click', () => {
      $('sectionBet').classList.remove('hidden');
      $('sectionRanking').classList.add('hidden');
      $('tabBet').className     = 'flex-1 py-2 text-center rounded-lg text-sm font-bold transition-all bg-white text-brand-700 shadow';
      $('tabRanking').className = 'flex-1 py-2 text-center rounded-lg text-sm font-bold transition-all text-white/60 hover:text-white';
    });

    $('tabRanking').addEventListener('click', async () => {
      $('sectionBet').classList.add('hidden');
      $('sectionRanking').classList.remove('hidden');
      $('tabRanking').className = 'flex-1 py-2 text-center rounded-lg text-sm font-bold transition-all bg-white text-brand-700 shadow';
      $('tabBet').className     = 'flex-1 py-2 text-center rounded-lg text-sm font-bold transition-all text-white/60 hover:text-white';
      await loadRanking();
    });

    // ========================================
    // レースカード生成
    // ========================================
    function createRaceCard(race) {
      const div = document.createElement('div');
      div.className = 'bg-white/90 backdrop-blur rounded-xl shadow-lg p-4 fade-in border border-white/30 hover:shadow-xl transition-shadow';

      // スプレッドシートのヘッダー名に合わせてプロパティを取得
      const raceId  = race['レースID'] || race.raceId || '';
      const lane    = race['レーン']   || race.lane   || '';
      const athlete = race['選手名']   || race.athlete || '';
      const time    = race['持ちタイム'] || race.time  || '';
      const startTime = race['発走時刻'] || '';
      const odds    = race['オッズ']   || race.odds   || '';

      div.innerHTML = `
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-extrabold text-sm shadow">${lane}</div>
          <div class="flex-1">
            <p class="font-bold text-gray-900 text-base">${athlete}</p>
            <p class="text-xs text-gray-400">レース ${raceId}${startTime ? ' ・ ' + startTime : ''}</p>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <div class="flex gap-3">
            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-md font-medium">⏱ ${time}</span>
            <span class="text-xs bg-brand-50 text-brand-700 px-2 py-1 rounded-md font-bold">× ${odds}</span>
          </div>
          <button class="bet-btn bg-gradient-to-r from-brand-600 to-brand-500 text-white text-sm font-bold px-4 py-1.5 rounded-lg hover:from-brand-700 hover:to-brand-600 active:scale-95 transition-all shadow shadow-brand-500/30"
            data-race-id="${raceId}" data-athlete="${athlete}" data-odds="${odds}">
            BET
          </button>
        </div>
      `;
      return div;
    }

    // ========================================
    // ベットモーダル
    // ========================================
    let currentBetData = {};

    document.addEventListener('click', e => {
      const btn = e.target.closest('.bet-btn');
      if (!btn) return;
      currentBetData = {
        raceId:  btn.dataset.raceId,
        athlete: btn.dataset.athlete,
        odds:    btn.dataset.odds,
      };
      $('betTargetInfo').textContent = `${currentBetData.athlete}（オッズ ×${currentBetData.odds}）にベットします`;
      $('betAmount').value = '';
      $('betError').classList.add('hidden');
      $('betConfirm').disabled = false;
      $('betConfirm').textContent = 'ベットする';
      $('betModal').classList.remove('hidden');
    });

    $('betCancel').addEventListener('click', () => {
      $('betModal').classList.add('hidden');
    });

    // ========================================
    // ベット送信処理（POST → GAS）
    // ========================================
    $('betConfirm').addEventListener('click', async () => {
      const amount = parseInt($('betAmount').value, 10);
      if (!amount || amount <= 0) {
        showBetError('1以上のポイントを入力してください');
        return;
      }

      const userId = localStorage.getItem('userId');
      const pin    = localStorage.getItem('userPin');

      // 二重送信防止: ボタンを無効化
      const confirmBtn = $('betConfirm');
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = '<span class="spinner"></span> 送信中...';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            userId:     userId,
            pin:        pin,
            raceId:     currentBetData.raceId,
            betAthlete: currentBetData.athlete,
            betPt:      amount,
          }),
        });

        const result = await response.json();

        if (result.success) {
          // 成功 → ポイント表示を更新してモーダルを閉じる
          $('userPoints').textContent = result.newPt + ' pt';
          $('betModal').classList.add('hidden');
          showToast('✅ ベット完了！');
        } else {
          showBetError(result.message || 'ベットに失敗しました');
        }
      } catch (err) {
        console.error(err);
        showBetError('通信エラーが発生しました。もう一度お試しください。');
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'ベットする';
      }
    });

    function showBetError(msg) {
      const el = $('betError');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    // ========================================
    // トースト通知
    // ========================================
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-green-500 text-white text-sm font-bold px-5 py-2.5 rounded-xl shadow-lg slide-up';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.4s'; }, 2000);
      setTimeout(() => toast.remove(), 2500);
    }

    // ========================================
    // ランキング読み込み（Usersシートを流用）
    // ========================================
    async function loadRanking() {
      const body = $('rankingBody');
      body.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-white/40 text-sm">読み込み中...</td></tr>';
      try {
        // GAS doGet に action パラメータを付けてランキングを取得
        const res = await fetch(GAS_URL + '?action=ranking');
        const data = await res.json();
        // ポイント降順でソート
        data.sort((a, b) => (parseInt(b['所持ポイント']) || 0) - (parseInt(a['所持ポイント']) || 0));
        body.innerHTML = '';
        data.forEach((user, i) => {
          const medals = ['🥇', '🥈', '🥉'];
          const rank = medals[i] || (i + 1);
          const tr = document.createElement('tr');
          tr.className = 'border-t border-white/5 hover:bg-white/5 transition';
          tr.innerHTML = `
            <td class="px-4 py-3 font-bold">${rank}</td>
            <td class="px-4 py-3">${user['カタカナ名'] || user['ID'] || ''}</td>
            <td class="px-4 py-3 text-right font-bold text-brand-300">${user['所持ポイント'] || 0} pt</td>
          `;
          body.appendChild(tr);
        });
      } catch (err) {
        body.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-red-400 text-sm">取得に失敗しました</td></tr>';
      }
    }

    // ========================================
    // アプリ初期化: レース情報取得 (GET)
    // ========================================
    async function initApp() {
      const container = $('raceList');
      const loading   = $('loadingIndicator');
      container.innerHTML = '';

      try {
        const response = await fetch(GAS_URL);
        const races = await response.json();
        loading.classList.add('hidden');
        if (!races || races.length === 0) {
          container.innerHTML = '<p class="text-center text-white/50 text-sm py-8">現在レース情報はありません</p>';
          return;
        }
        races.forEach((race, i) => {
          const card = createRaceCard(race);
          card.style.animationDelay = (i * 0.07) + 's';
          container.appendChild(card);
        });
      } catch (err) {
        console.error('レース情報の取得に失敗:', err);
        loading.innerHTML = '<p class="text-red-400 text-sm">レース情報の取得に失敗しました。<br>ページを再読み込みしてください。</p>';
      }
    }

    // ========================================
    // 自動ログイン（localStorage確認）
    // ========================================
    window.addEventListener('load', () => {
      const savedId  = localStorage.getItem('userId');
      const savedPin = localStorage.getItem('userPin');
      if (savedId && savedPin) {
        $('loginModal').classList.add('hidden');
        $('app').classList.remove('hidden');
        initApp();
      }
    });
  </script>
</body>
</html>
